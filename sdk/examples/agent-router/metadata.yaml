# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: agent-router
name: Agent Router
summary: Monitor ordinary gateway clients through an Envoy external processor and the
  public Watcher SDK.
category: gateway
upstream_url: https://github.com/theagentrouter/agent-router
support_status: experimental
updated_at: '2026-10-14'
capabilities:
  observe:
    implemented: true
    scope: Submit complete visible textual Chat exchanges and grade returned client
      tool proposals according to server policy.
    example: gateway/agent-router.yaml
  enforce:
    implemented: true
    scope: Hold the gateway response, or a streamed response from its first tool call,
      until Watcher decides; refused proposals are removed and explained in an ordinary
      completion, followed by up to two graded alternatives when a gateway URL is configured.
    example: gateway/agent-router.yaml
    boundary: gateway-response-delivery
    context: complete exchange snapshot
    recording: optional
    failure_behavior: follows-server-policy
    failure_details: Processor, transport and malformed-response errors withhold delivery;
      server grading-error decisions follow administrator policy. Hook success acknowledges
      submission, not durable storage.
manifests:
- pyproject.toml
verification:
- checked_at: '2026-10-06'
  watcher_sdk:
    version: 0.1.0
  watcher_server:
    version: dev
  watcher_test_target: local-api
  upstream_versions:
    aigw: v1.1.0
  runtimes:
    python: 3.12.13
  platform: Linux-7.0.0-1012-aws-x86_64-with-glibc2.39
  results:
    observe:
      result: passed
      coverage: native-local-api
      checks:
      - python
      - native
      - backend
    enforce:
      result: passed
      coverage: native-local-api
      checks:
      - python
      - native
      - backend
    export: null
limitations:
- id: openai-schema-only
  mode: both
  cause: upstream
  kind: constraint
  description: Agent Router translates provider responses after this processor runs,
    so only backends with the OpenAI schema are readable. Other schemas are withheld
    with HTTP 403.
- id: tool-boundary
  mode: enforce
  cause: integration-scope
  description: The gateway can withhold client tool proposals. It cannot stop tools
    already executed by the provider or unrelated actions outside this Gateway.
- id: approval
  mode: enforce
  cause: integration-scope
  description: Denials and escalations remove the proposal's calls and explain them in
    the response text. This example has no human approval interface or resume mechanism.
    Same-request alternatives need GATEWAY_URL; a failed alternative ends the response
    with the notices rather than an error.
- id: alternative-sessions
  mode: both
  cause: integration-scope
  description: Each alternative is generated by a separate request through the gateway,
    and each one Watcher grades is submitted as its own Watcher session; the client's
    session and response header name only the original exchange, and logs link the two
    IDs. Alternatives refused for repeating a refused operation are not submitted.
- id: exchange-identity
  mode: both
  cause: integration-scope
  description: Ordinary generic Chat clients get a separate Watcher session per exchange,
    containing their supplied full-history snapshot. Supported Chat-compatible harness
    traffic may group by a backend-recognized native session ID.
- id: format
  mode: both
  cause: integration-scope
  description: The Gateway accepts Chat Completions, buffered or streamed, with client
    function tools; other API paths and compressed provider responses are rejected.
    A streamed response holds every event from the first tool call until the provider
    finishes; a technical failure ends the stream with an SSE error event rather than
    an HTTP status. Local native verification covers text.
- id: processor-access
  mode: both
  cause: integration-scope
  kind: constraint
  description: The gRPC link from Envoy to the processor is unauthenticated; keep
    the processor on loopback, a Unix socket or a private network that only Envoy
    can reach.
- id: client-auth
  mode: both
  cause: upstream
  kind: constraint
  description: The processor checks a single shared gateway client key. aigw run v1.1.0
    does not pass user Secrets to Envoy Gateway, so Secret-backed SecurityPolicy client
    authentication fails there; Secret-free policies were not tested.
- id: storage
  mode: both
  cause: watcher
  description: Hook success does not prove durable storage. Verify transcripts and
    decisions through public readback; no durable delivery queue is provided.
- id: backend
  mode: both
  cause: unverified
  kind: verification-gap
  description: The backend tests used a local development Watcher server and a simulated
    provider. A deployed Watcher service, Kubernetes deployment, live provider behavior
    and model quality are not established by these tests.
verification_plan:
  watcher_test_target: fixture-http
  observe:
    coverage: native-fixture
    checks:
    - python
    - native
  enforce:
    coverage: native-fixture
    checks:
    - python
    - native
