# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: agno
name: Agno
summary: Native tool monitoring follows configured Watcher policy, with optional awaited
  application approval.
category: agent-framework
upstream_url: https://github.com/agno-agi/agno
support_status: experimental
updated_at: '2026-09-30'
capabilities:
  observe:
    implemented: true
    scope: The native pre-tool integration observes without enforcing when server
      mode is observe. A separate completed-history observer is also available.
    example: demo/observe.py
    context: conversation
    recording: optional
    timeout_seconds: 420
  enforce:
    implemented: true
    scope: Buffered WatcherAgent.arun with native Function pre-hooks and provider
      history capture. Synchronous runs, streaming and native continuation are refused.
      Synchronous tool bodies run in a worker thread after the awaited check.
      Final transcript recording uses the monitor timeout, configurable with a
      420-second default.
    example: demo/enforce.py
    boundary: WatcherAgent async Function pre-hook and provider history capture
    context: conversation
    recording: optional
    failure_behavior: fail-closed
    failure_details: Transport or malformed/mismatched outcomes block. Deferred preserves
      ordinary native permissions; configured grading-failure allow is honored. Human
      escalation waits for an application callback, or blocks unattended. WatcherAgent
      refuses synchronous execution, streaming and native continuation before dispatch.
    timeout_seconds: 420
manifests:
- pyproject.toml
verification:
- checked_at: '2026-09-26'
  watcher_sdk:
    version: 0.1.0
  watcher_server: null
  watcher_test_target: mocked-sdk-transport
  upstream_versions:
    agno: 2.2.3
  runtimes:
    python: 3.12.3
  platform: linux-x86_64
  results:
    observe:
      result: passed
      coverage: native-fixture
      checks:
      - python
    enforce:
      result: passed
      coverage: native-fixture
      checks:
      - python
    export: null
limitations:
- id: asynchronous-agent-dispatch
  mode: both
  cause: integration-scope
  kind: constraint
  description: The monitored agent supports buffered arun only. Use WatcherAgent with
    a CaptureModelCalls model and Function tools; ordinary Agent.run does not await
    async pre-hooks. WatcherAgent rejects run, streaming and native continuation.
    It gates synchronous tool bodies before worker-thread execution; generator
    tools are refused. The constructor refuses read_chat_history,
    read_tool_call_history, search_session_history, enable_agentic_memory,
    enable_agentic_culture and enable_agentic_state. With knowledge or
    knowledge_retriever, search_knowledge and update_knowledge must be disabled;
    these options otherwise add tools outside the registered Function list.
    Changing tools, hooks or these options after construction bypasses this setup.
    Application AgentRunException subclasses retain their retry/stop semantics;
    ordinary pre-hook errors become explicit withheld calls.
- id: retrospective-decision-audit
  mode: observe
  cause: watcher
  kind: constraint
  description: This retrospective observation path inherits the organization's mode.
    In Enforce mode, Watcher can store an assessment as an applied denial and count
    it in automatic-denial totals after the tool has run. These records do not show
    that execution was prevented.
- id: scope-01
  mode: both
  cause: integration-scope
  kind: constraint
  description: Historical tool prefixes exclude future text; incomplete outcomes raise,
    and final recording is attempted even after judgment failure.
- id: scope-04
  mode: both
  cause: integration-scope
  kind: constraint
  description: The separate post-run observation path cannot prevent side effects.
- id: scope-05
  mode: both
  cause: integration-scope
  kind: constraint
  description: Text and function content only; full retained history required.
- id: scope-06
  mode: both
  cause: integration-scope
  kind: constraint
  description: Pass the complete native history returned by the lifecycle shown in
    demo/observe.py.
- id: deployed-verification
  mode: both
  cause: unverified
  kind: verification-gap
  description: This example has no deployed Watcher storage or grading verification;
    local fixtures simulate server outcomes.
- id: asynchronous-recording
  mode: both
  cause: watcher
  kind: constraint
  description: Hook responses do not acknowledge durable storage. Authorized transcript/decision
    recording runs after response; query Watcher to confirm persistence.
- id: application-approval
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Human approval uses an awaited application callback followed by a public
    decision upload and readback. This requires session-read plus owner/write-any
    access. No approval UI, durable interrupt/resume, or automatic-review model is
    included.
verification_plan:
  watcher_test_target: mocked-sdk-transport
  observe:
    coverage: native-fixture
    checks:
    - python
  enforce:
    coverage: native-fixture
    checks:
    - python
