[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "watcher-example-aider"
version = "0.1.0"
description = "Experimental aider integration using the public Watcher SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1", "aider-chat==0.86.2"]

[project.scripts]
"watcher-aider-observe" = "watcher_aider.integration:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_aider"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.uv]
exclude-newer = "7 days"
