    quality or latency.
- id: native-dispatch-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: The real CLI requires Amp getUserInfo/loadPlugins service initialization
    before tools; a local model fixture is insufficient.
- id: delegate-contract-unverified
  mode: enforce
