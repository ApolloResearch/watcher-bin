limitations:
- id: retrospective-decision-audit
  mode: observe
  cause: watcher
  kind: constraint
  description: This retrospective observation path inherits the organization's mode.
    In Enforce mode, Watcher can store an assessment as an applied denial and count
    it in automatic-denial totals after the tool has run. These records do not show
    that execution was prevented.
- id: scope-03
  mode: both
  cause: integration-scope
  kind: constraint
  description: The separate post-run observation path cannot prevent side effects;
    organization policy can reject the observe override.
- id: scope-04
  mode: both
  cause: integration-scope
  kind: constraint
  description: Only finalized text and object-shaped arguments; full retained history
    required.
- id: scope-05
  mode: both
  cause: unverified
  kind: verification-gap
  description: Native function dispatch, streaming, parallel crews, compaction, multimodal
    content and result_as_answer=True are unverified.
- id: scope-06
  mode: both
  cause: upstream
  kind: constraint
  description: Parsed actions have no native execution IDs. The adapter retains one
    application UUID per completed action; recreating the trace creates new IDs.
- id: scope-07
  mode: both
  cause: upstream
  kind: constraint
  description: CrewAI attempts hosted trace initialization despite process-start telemetry
    flags and Crew(tracing=False); runtime fixtures require external-network isolation.
- id: deployed-verification
  mode: both
  cause: unverified
  kind: verification-gap
  description: This example has no deployed Watcher storage, grading or Analyzer visibility
    verification; local fixtures simulate server outcomes.
- id: asynchronous-recording
  mode: both
  cause: watcher
  kind: constraint
  description: Hook responses do not acknowledge durable storage. Authorized transcript/decision
    recording runs after response; query Watcher to confirm persistence.
- id: application-approval
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Human approval uses an awaited application callback followed by a public
    decision upload and readback. This requires session-read plus owner/write-any
    access. No approval UI, durable interrupt/resume, or automatic-review model is
    included.
verification_plan:
  watcher_test_target: fixture-http
  observe:
    coverage: native-fixture
    checks:
