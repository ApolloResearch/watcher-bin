# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: cursor
name: Cursor
summary: Partial event-journal context from documented hooks; native dispatch is unverified.
category: coding-harness
upstream_url: https://cursor.com/docs/agent/hooks
support_status: experimental
updated_at: '2026-10-01'
capabilities:
  observe:
    implemented: true
    scope: Partial event-journal context from documented hooks; native dispatch is
      unverified.
    example: demo/hooks.example.json
  enforce:
    implemented: true
    scope: Documented preToolUse adapter with partial event context; native dispatch
      is unverified.
    example: demo/hooks.enforce.example.json
    boundary: native-hook
    context: partial event-journal context
    recording: required
    failure_behavior: native-may-allow
    timeout_seconds: 420
    native_timeout_seconds: 480
    failure_details: Caught SDK failures refuse the call; native hook startup, crash
      or deadline handling is upstream-owned and may allow execution.
manifests:
- pyproject.toml
verification:
- checked_at: '2026-09-26'
  watcher_sdk:
    version: 0.1.0
  watcher_server: null
  watcher_test_target: mocked-sdk-transport
  upstream_versions:
    cursor: null
  runtimes:
    python: 3.12.3
  platform: linux-x86_64
  results:
    observe:
      result: passed
      coverage: contract
      checks:
      - python
    enforce:
      result: passed
      coverage: contract
      checks:
      - python
    export: null
limitations:
- id: retrospective-decision-audit
  mode: observe
  cause: watcher
  kind: constraint
  description: This retrospective observation path inherits the organization's mode.
    In Enforce mode, Watcher can store an assessment as an applied denial and count
    it in automatic-denial totals after the tool has run. These records do not show
    that execution was prevented.
- id: deployed-server-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Local fixtures do not establish deployed Watcher persistence, grading
    quality or latency.
- id: native-dispatch-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Authenticated Cursor service access is needed before native hooks;
    the credential-free CLI diagnostic stops before dispatch.
verification_plan:
  watcher_test_target: mocked-sdk-transport
  observe:
    coverage: contract
    checks:
    - python
  enforce:
    coverage: contract
    checks:
    - python
