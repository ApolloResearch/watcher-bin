[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watcher-github-copilot-cli"
version = "0.1.0"
description = "Watcher SDK example for github-copilot-cli"
requires-python = ">=3.12"
dependencies = ["watcher-sdk[cli]>=0.1,<1", "filelock>=3.19,<4", "pydantic>=2.11,<3", "typer==0.24.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
]

[project.scripts]
watcher-github-copilot-cli = "watcher_github_copilot_cli.cli:main"

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_github_copilot_cli"]

[tool.uv]
exclude-newer = "7 days"
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.uv.workspace]
members = []
