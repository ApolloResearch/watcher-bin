# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: google-security-operations
name: Google Security Operations
summary: Export Watcher decisions, flagged-session summaries and optional transcripts
  as UDM events through the Chronicle API.
category: observability
direction: from-watcher
upstream_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.events/import
support_status: experimental
updated_at: '2026-09-25'
capabilities:
  observe:
    implemented: false
    scope: This example exports Watcher records rather than importing agent activity.
    example: null
  enforce:
    implemented: false
    scope: Historical event export cannot synchronously prevent agent actions.
    example: null
  export:
    implemented: true
    scope: Finite occurrence-time windows of tool-call decisions, activity-overlap
      windows of flagged-session summaries, and explicitly opted-in complete transcripts.
    example: demo/export.py
    context: stored decisions, session summaries and optional transcripts
    recording: none
manifests:
- pyproject.toml
verification:
- checked_at: '2026-09-26'
  watcher_sdk:
    version: 0.1.0
  watcher_server: null
  watcher_test_target: fixture-http
  upstream_versions:
    google-security-operations-api: v1
    protobuf: 6.33.6
  runtimes:
    python: 3.12.14
  platform: Linux-6.17.0-1022-azure-x86_64-with-glibc2.36
  results:
    observe:
      result: not-run
      coverage: null
      checks: []
    enforce:
      result: not-run
      coverage: null
      checks: []
    export:
      result: passed
      coverage: contract
      checks:
      - native
limitations:
- id: source-pagination
  mode: export
  cause: watcher
  kind: constraint
  description: Offset pagination and occurrence-time filters provide neither a stable
    snapshot nor a decision-change cursor; late arrivals and edits need reconciliation.
- id: replay
  mode: export
  cause: integration-scope
  kind: constraint
  description: Earlier batches can remain accepted after failure. Replayed windows
    may duplicate events; no exactly-once or complete-audit-feed guarantee is provided.
- id: hosted-udm-validation
  mode: export
  cause: unverified
  kind: verification-gap
  description: Google-hosted UDM validation, IAM access, indexed search and detections
    require verification in the operator's instance; local tests check HTTP contracts.
- id: token-lifetime
  mode: export
  cause: integration-scope
  kind: constraint
  description: The operator supplies a short-lived OAuth access token; this example
    does not discover ambient Google credentials or refresh tokens.
- id: notification-feed
  mode: export
  cause: watcher
  description: The public SDK exposes stored decisions and sessions, but no notification-delivery
    feed. These exports are snapshots, not notification events.
- id: transcript-content
  mode: export
  cause: integration-scope
  description: Transcripts are excluded by default. Opting in exports their content
    and any sensitive information they contain; filter or redact it before destination
    delivery as required.
verification_plan:
  watcher_test_target: fixture-http
  observe: null
  enforce: null
  export:
    coverage: contract
    checks:
    - native
