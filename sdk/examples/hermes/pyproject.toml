[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "watcher-example-hermes"
version = "0.1.0"
description = "Experimental Hermes Agent integration using the public Watcher SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer==0.25.1", "watcher-sdk>=0.1,<1"]

[project.scripts]
watcher-hermes = "watcher_hermes.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_hermes"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.uv]
exclude-newer = "7 days"
