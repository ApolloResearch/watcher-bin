[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-langchain-example"
version = "0.1.0"
description = "Experimental LangChain observation and synchronous monitoring with Watcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watcher-sdk>=0.1,<1",
    "langchain-core==1.6.6",
    "langchain==1.4.3",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_langchain"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
junit_family = "legacy"

[tool.uv]
exclude-newer = "7 days"
