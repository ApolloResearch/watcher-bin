# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: langgraph
name: LangGraph
summary: Native before-tool monitoring follows configured Watcher policy; optional
  application approval and completed transcript submission.
category: agent-framework
upstream_url: https://github.com/langchain-ai/langgraph
support_status: experimental
updated_at: '2026-09-30'
capabilities:
  observe:
    implemented: true
    scope: The same native before-tool integration observes without enforcing when
      the server selects observe. A separate completed-history observer is available
      for imports.
    example: demo/observe.py
    context: conversation
    recording: optional
    timeout_seconds: 420
  enforce:
    implemented: true
    scope: Native async ToolNode callback applies allow, deny and escalation. An optional
      awaited application callback obtains human approval; without it, escalations
      block. The registered node refuses synchronous invoke and stream dispatch.
    example: demo/enforce.py
    boundary: native ToolNode async middleware with synchronous dispatch refusal
    context: conversation
    recording: optional
    failure_behavior: fail-closed
    failure_details: Transport errors and malformed or mismatched outcomes block.
      Applied deferred preserves framework permissions; an administrator-configured
      allow on grading failure is honored. Synchronous graph execution raises at the
      monitored node before its tools execute. Parallel effects are not rolled back.
    timeout_seconds: 420
manifests:
- pyproject.toml
verification:
- checked_at: '2026-09-26'
  watcher_sdk:
    version: 0.1.0
  watcher_server: null
  watcher_test_target: mocked-sdk-transport
  upstream_versions:
    langgraph: 1.0.3
    langgraph-prebuilt: 1.0.2
    langchain-core: 1.0.7
  runtimes:
    python: 3.12.3
  platform: linux-x86_64
  results:
    observe:
      result: passed
      coverage: native-fixture
      checks:
      - python
    enforce:
      result: passed
      coverage: native-fixture
      checks:
      - python
    export: null
limitations:
- id: asynchronous-tool-dispatch
  mode: both
  cause: integration-scope
  kind: constraint
  description: The monitored ToolNode supports ainvoke and astream. It rejects invoke
    and stream before executing its tools; earlier graph nodes may already have
    run. Only tools registered through monitored_tool_node are intercepted.
- id: retrospective-decision-audit
  mode: observe
  cause: watcher
  kind: constraint
  description: This retrospective observation path inherits the organization's mode.
    In Enforce mode, Watcher can store an assessment as an applied denial and count
    it in automatic-denial totals after the tool has run. These records do not show
    that execution was prevented.
- id: scope-01
  mode: both
  cause: integration-scope
  kind: constraint
  description: Historical tool prefixes exclude future text; incomplete outcomes raise,
    and final recording is attempted even after judgment failure.
- id: scope-04
  mode: both
  cause: integration-scope
  kind: constraint
  description: The observation path waits after execution and cannot prevent tools;
    neither example provides a durable retry queue.
- id: scope-05
  mode: both
  cause: integration-scope
  kind: constraint
  description: Text and function tools only; full history required for every snapshot.
- id: scope-06
  mode: both
  cause: integration-scope
  kind: constraint
  description: Observe override requires organization permission; text-only histories
    are archival.
- id: deployed-verification
  mode: both
  cause: unverified
  kind: verification-gap
  description: This example has no deployed Watcher storage or grading verification;
    local fixtures simulate server outcomes.
- id: asynchronous-recording
  mode: both
  cause: watcher
  kind: constraint
  description: Hook responses do not acknowledge durable storage. Authorized transcript
    and decision recording runs after response; query Watcher to confirm persistence.
- id: application-approval
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Human approval uses an awaited application callback followed by a public
    decision upload and readback. This requires session-read plus owner/write-any
    access. No approval UI, durable interrupt/resume, or automatic-review model is
    included.
verification_plan:
  watcher_test_target: mocked-sdk-transport
  observe:
    coverage: native-fixture
    checks:
    - python
  enforce:
    coverage: native-fixture
    checks:
    - python
