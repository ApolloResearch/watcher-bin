# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: litellm
name: LiteLLM proxy
summary: Proxy callback that holds each model response until Watcher has judged its
  tool calls. Watcher parses the raw provider exchange; the callback withholds refused
  calls before the client can run them.
category: gateway
direction: to-watcher
upstream_url: https://github.com/BerriAI/litellm
support_status: experimental
updated_at: '2026-10-01'
capabilities:
  observe:
    implemented: true
    scope: Chat Completions, Responses and Anthropic Messages proxy routes, buffered
      or streamed. Exchanges are submitted for recording; observe-mode decisions are
      deferred and responses are released unchanged.
    example: src/watcher_litellm/config.yaml
    context: conversation
    recording: optional
  enforce:
    implemented: true
    scope: Client tool calls in responses on the Chat Completions, Responses and Anthropic
      Messages proxy routes, buffered or streamed.
    example: src/watcher_litellm/config.yaml
    boundary: Proxy response delivery, before the client can execute any returned
      tool call.
    context: conversation
    recording: optional
    failure_behavior: fail-closed
    failure_details: A Watcher timeout, outage or error withholds the whole response
      with an HTTP error. Grading failures inside Watcher follow the server's on_grading_failure
      policy, which can allow.
manifests:
- pyproject.toml
verification:
- checked_at: '2026-10-01'
  watcher_sdk:
    version: 0.1.0
  watcher_server:
    version: dev
  watcher_test_target: local-api
  upstream_versions:
    litellm: 1.101.0
    openai: 2.54.0
    anthropic: 0.125.0
  runtimes:
    python: 3.12.13
  platform: Linux-7.0.0-1012-aws-x86_64-with-glibc2.36
  results:
    observe:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    enforce:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    export: null
limitations:
- id: uncovered-routes
  mode: both
  cause: integration-scope
  kind: constraint
  description: Realtime, WebSockets, batches, files and LiteLLM provider pass-through
    endpoints are not checked and must be blocked in an enforcing deployment.
- id: provider-hosted-tools
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Tools that run on the provider's servers execute before the response
    exists and cannot be prevented.
- id: identity-scope
  mode: both
  cause: integration-scope
  kind: constraint
  description: Only requests with x-watcher-session-id get a litellm-prefixed conversation
    ID and the Gateway source. Without the header, Watcher groups requests by a native
    session ID, as Claude Code and Codex normally send, or else by shared conversation
    history, and the Analyzer shows the session as Hooks API. Qwen Code and Mistral
    Vibe cannot send the header.
- id: whole-response-withheld
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: When any tool call in a response is refused, every tool call in that
    response is withheld and replaced by an explanation.
- id: buffered-streaming
  mode: both
  cause: integration-scope
  kind: constraint
  description: Streamed responses are buffered until Watcher decides; clients see
    no output before then.
- id: full-history
  mode: both
  cause: integration-scope
  kind: constraint
  description: Each request must carry the whole conversation. More than one choice
    and provider-stored Responses history are refused before the provider runs.
- id: responses-stream-named-tool-choice
  mode: both
  cause: upstream
  kind: constraint
  description: LiteLLM 1.101.0 cannot stream Responses to non-OpenAI providers when
    tool_choice names a function; the proxy fails before the callback runs.
- id: bedrock-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Live tests covered OpenAI, Anthropic, Vertex Gemini and two OpenRouter-hosted
    models; Bedrock-backed routes were not exercised.
- id: gemini-cli-unsupported
  mode: both
  cause: integration-scope
  kind: constraint
  description: Gemini CLI uses the generateContent API, which LiteLLM serves only
    through a pass-through route this callback does not see.
- id: deployed-server-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Live tests used a local Watcher server; deployed persistence and grading
    were not exercised.
- id: automated-local-api-coverage
  mode: both
  cause: unverified
  kind: verification-gap
  description: Automated local Watcher and database checks cover Chat Completions,
    including streaming. Responses and Anthropic Messages are covered against
    a Watcher HTTP fixture; the separate live suite requires configured services.
verification_plan:
  watcher_test_target: fixture-http
  observe:
    coverage: native-fixture
    checks:
    - native
  enforce:
    coverage: native-fixture
    checks:
    - native
