# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: litellm
name: LiteLLM proxy
summary: Proxy callback that streams content until a tool call needs evaluation,
  then releases each permitted call in order. Denials and escalations can prompt
  two evaluated alternatives; refused calls never become client-executable events.
category: gateway
direction: to-watcher
upstream_url: https://github.com/BerriAI/litellm
support_status: experimental
updated_at: '2026-10-06'
capabilities:
  observe:
    implemented: true
    scope: Chat Completions, Responses and Anthropic Messages proxy routes, buffered
      or streamed. Exchanges are submitted for recording; observe-mode decisions are
      deferred and responses are released unchanged.
    example: src/watcher_litellm/config.yaml
    context: conversation
    recording: optional
  enforce:
    implemented: true
    scope: Client tool calls in responses on the Chat Completions, Responses and Anthropic
      Messages proxy routes, buffered or streamed.
    example: src/watcher_litellm/config.yaml
    boundary: Proxy response delivery, before the client can execute any returned
      tool call.
    context: conversation
    recording: optional
    failure_behavior: fail-closed
    failure_details: Each normal evaluation has a 300-second deadline, excluding
      earlier provider generation. A denial or escalation withholds the call and
      can trigger two alternatives. Recovery shares that evaluation's deadline,
      including remaining provider generation and further evaluations. Exhausting
      three proposals returns explanatory text; transport, protocol and timeout
      failures end delivery with an error. Earlier released calls cannot be retracted.
      Grading failures inside Watcher follow on_grading_failure, which can allow.
manifests:
- pyproject.toml
verification:
- checked_at: '2026-10-01'
  watcher_sdk:
    version: 0.1.0
  watcher_server:
    version: dev
  watcher_test_target: local-api
  upstream_versions:
    litellm: 1.101.0
    openai: 2.54.0
    anthropic: 0.125.0
  runtimes:
    python: 3.12.13
  platform: Linux-7.0.0-1012-aws-x86_64-with-glibc2.36
  results:
    observe:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    enforce:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    export: null
limitations:
- id: uncovered-routes
  mode: both
  cause: integration-scope
  kind: constraint
  description: Realtime, WebSockets, batches, files and LiteLLM provider pass-through
    endpoints are not checked and must be blocked in an enforcing deployment.
- id: provider-hosted-tools
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Tools that run on the provider's servers execute before the response
    exists and cannot be prevented.
- id: identity-scope
  mode: both
  cause: integration-scope
  kind: constraint
  description: Requests must supply x-watcher-session-id or valid native Claude
    session UUID or Codex thread UUID metadata. Without either, the callback returns
    HTTP 400 before provider generation. Both forms produce a litellm-prefixed
    alias and the Gateway source. Clients unable to supply one need an adapter.
- id: whole-response-withheld
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: For non-streaming responses, one refused tool call withholds every
    tool call in that proposal. The callback can generate two alternatives and
    returns only an accepted proposal's calls with ordinary denial notices.
- id: chat-tool-completion
  mode: both
  cause: integration-scope
  kind: constraint
  description: Chat Completions has no per-call completion marker, so tool calls
    wait for finish_reason before evaluation. Text before the first tool streams
    immediately. Messages and Responses evaluate each completed call as it arrives.
- id: streaming-partial-outcome
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: Recovery or a stream error can follow an earlier approved call.
    Client execution results are unknown to the gateway; clients must preserve
    earlier effects and avoid repeating them automatically.
- id: recovery-limits
  mode: enforce
  cause: integration-scope
  kind: constraint
  description: At most two alternatives follow the original proposal. Denied or
    previously released operations with the same tool name and arguments are
    blocked during recovery even under a fresh call ID. Different arguments with
    equivalent effects are not deduplicated.
- id: recovery-usage
  mode: both
  cause: integration-scope
  kind: constraint
  description: Client-visible usage describes the first provider attempt, not
    total usage or cost across recovery generations.
- id: incremental-recording
  mode: both
  cause: integration-scope
  kind: constraint
  description: Incremental evaluations and recovery may create partial proposal
    branches in the same session alongside the delivered history. Recording is
    not a single canonical transcript of client execution.
- id: full-history
  mode: both
  cause: integration-scope
  kind: constraint
  description: Each request must carry the whole conversation. Choice counts other
    than one and provider-stored Responses history are refused before the provider runs.
- id: responses-stream-named-tool-choice
  mode: both
  cause: upstream
  kind: constraint
  description: LiteLLM 1.101.0 cannot stream Responses to non-OpenAI providers when
    tool_choice names a function; the proxy fails before the callback runs.
- id: bedrock-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Live tests covered OpenAI, Anthropic, Vertex Gemini and two OpenRouter-hosted
    models; Bedrock-backed routes were not exercised.
- id: gemini-cli-unsupported
  mode: both
  cause: integration-scope
  kind: constraint
  description: Gemini CLI uses the generateContent API, which LiteLLM serves only
    through a pass-through route this callback does not see.
- id: deployed-server-unverified
  mode: both
  cause: unverified
  kind: verification-gap
  description: Live tests used a local Watcher server; deployed persistence and grading
    were not exercised.
- id: automated-local-api-coverage
  mode: both
  cause: unverified
  kind: verification-gap
  description: Automated local Watcher and database checks cover Chat Completions,
    including streaming. Responses and Anthropic Messages are covered against
    a Watcher HTTP fixture; the separate live suite requires configured services.
verification_plan:
  watcher_test_target: fixture-http
  observe:
    coverage: native-fixture
    checks:
    - native
  enforce:
    coverage: native-fixture
    checks:
    - native
