[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-litellm-example"
version = "0.2.0"
description = "Experimental LiteLLM proxy guardrail that sends raw provider exchanges to Watcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watcher-sdk>=0.1,<1",
    "litellm[proxy,extra_proxy]>=1.108.3,<2",
    "asyncpg>=0.30,<1",
    "zstandard>=0.23,<1",
    "structlog>=25.5,<27",
]

[dependency-groups]
dev = ["anthropic>=0.70,<1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov>=6,<8", "pyyaml==6.0.3", "testcontainers[postgres]>=4.14.1,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_litellm"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "live: needs a running Watcher server and real providers or agent CLIs",
    "requires_docker: needs Docker to run the PostgreSQL integration fixture",
]

[tool.coverage.run]
# The HTTP suites load the real callback in a separate LiteLLM process.
patch = ["subprocess"]
sigterm = true

[project.scripts]
watcher-litellm-config = "watcher_litellm.config:main"
watcher-litellm-copilot-config = "watcher_litellm.config:copilot_main"
watcher-litellm-copilot-migrate = "watcher_litellm.copilot_migrate:main"

[tool.uv]
exclude-newer = "7 days"
# Approved by the operator on 2026-11-10 for #17171: LiteLLM 1.108.3 and its
# required enterprise dependency only. Retain the age filter for other packages.
# TODO(#17171): remove after 2026-11-14 22:27 UTC, then run
# `uv lock --upgrade-package litellm --upgrade-package litellm-enterprise`.
exclude-newer-package = { litellm = "2026-11-08T00:00:00Z", litellm-enterprise = "2026-11-08T00:00:00Z" }
