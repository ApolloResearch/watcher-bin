[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watcher-mastra-bridge"
version = "0.1.0"
description = "Experimental Python SDK bridge for Mastra observation and synchronous monitoring"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1", "typer==0.25.1"]

[project.scripts]
watcher-mastra-observe = "watcher_mastra_bridge.bridge:cli"
watcher-mastra-gate = "watcher_mastra_bridge.gate:app"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv.sources]
watcher-sdk = { path = "../../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_mastra_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
exclude-newer = "7 days"
package = true

[tool.uv.workspace]
members = []
