[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "watcher-example-mistral-vibe"
version = "0.1.0"
description = "Experimental mistral-vibe integration using the public Watcher SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1"]

[project.scripts]
"watcher-mistral-vibe-enforce" = "watcher_mistral_vibe.pre_tool:main"
"watcher-mistral-vibe-observe" = "watcher_mistral_vibe.integration:main"
"watcher-mistral-vibe-observe-settings" = "watcher_mistral_vibe.configuration:observe_settings"
"watcher-mistral-vibe-enforce-settings" = "watcher_mistral_vibe.configuration:enforce_settings"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_mistral_vibe"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.uv]
exclude-newer = "7 days"
