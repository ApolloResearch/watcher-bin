receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  otlphttp/dataprepper:
    logs_endpoint: ${env:DATA_PREPPER_LOGS_ENDPOINT}
    encoding: proto
    compression: none
    sending_queue:
      enabled: false
    retry_on_failure:
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp/dataprepper]
