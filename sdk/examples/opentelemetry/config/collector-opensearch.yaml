receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
extensions:
  sigv4auth:
    region: ${env:AWS_REGION}
    service: osis
exporters:
  otlphttp/opensearch:
    logs_endpoint: ${env:OPENSEARCH_INGESTION_LOGS_ENDPOINT}
    encoding: proto
    compression: none
    auth:
      authenticator: sigv4auth
    sending_queue:
      enabled: false
    retry_on_failure:
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
service:
  extensions: [sigv4auth]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp/opensearch]
