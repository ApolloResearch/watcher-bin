# Ephemeral loopback-only test storage. Not a production deployment configuration.
auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
memberlist:
  bind_addr: [127.0.0.1]
  advertise_addr: 127.0.0.1
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
analytics:
  reporting_enabled: false
