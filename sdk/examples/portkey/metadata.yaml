# yaml-language-server: $schema=../metadata.schema.json
schema_version: 2
slug: portkey
name: Portkey
summary: Monitor client-facing requests and gate generated function calls from the
  gateway.
category: gateway
upstream_url: https://github.com/Portkey-AI/gateway
support_status: experimental
updated_at: '2026-10-01'
capabilities:
  observe:
    implemented: true
    scope: Native gateway callback records supported full-history Chat Completions
      exchanges. Generic clients get separate sessions per exchange; recognized harnesses
      may group by native session ID.
    example: gateway/server.mjs
  enforce:
    implemented: true
    scope: Withholds generated client function calls at the gateway until Watcher
      returns an applied allow or deferred decision.
    example: gateway/server.mjs
    boundary: gateway-response
    context: conversation
    recording: optional
    failure_behavior: mixed
    failure_details: Transport errors and missing outcomes withhold responses; applied
      grading-failure decisions follow organization policy. Hook replies do not acknowledge
      durable recording.
    timeout_seconds: 420
manifests:
- pyproject.toml
verification:
- checked_at: '2026-09-26'
  watcher_sdk:
    version: 0.1.0
  watcher_server:
    version: dev
  watcher_test_target: local-api
  upstream_versions:
    portkey: 1.15.2
  runtimes:
    python: 3.12.14
    node: v24.11.1
  platform: Linux-6.17.0-1022-azure-x86_64-with-glibc2.41
  results:
    observe:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    enforce:
      result: passed
      coverage: native-local-api
      checks:
      - native
      - backend
    export: null
limitations:
- id: native-scope
  mode: both
  cause: integration-scope
  kind: constraint
  description: Only textual Chat Completions and client function tools are supported;
    one choice.
- id: identity-scope
  mode: both
  cause: integration-scope
  kind: constraint
  description: Generic clients receive a separate session per exchange. Recognized
    Chat harnesses may group by client-supplied native session IDs, which do not authenticate
    users. Local isolation checks cover generic clients, not impersonation of recognized
    harness sessions.
- id: provider-tools
  mode: both
  cause: integration-scope
  kind: constraint
  description: Provider-hosted tools and other native execution surfaces are not prevented
    by intercepting model responses.
- id: storage-receipt
  mode: both
  cause: watcher
  kind: constraint
  description: The bridge requires sessions:ingest at startup, but hook success acknowledges
    evaluation and scheduled ingestion rather than durable storage.
- id: native-verification
  mode: both
  cause: unverified
  kind: verification-gap
  description: Hosted providers, deployed authentication and production service configuration
    are unverified.
- id: streaming-scope
  mode: both
  cause: upstream
  kind: blocker
  description: Streaming and routes outside Chat Completions are rejected because
    the pinned native response hook cannot enforce them.
verification_plan:
  watcher_test_target: fixture-http
  observe:
    coverage: native-fixture
    checks:
    - native
  enforce:
    coverage: native-fixture
    checks:
    - native
