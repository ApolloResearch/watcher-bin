[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-pydantic-ai-example"
version = "0.1.0"
description = "Experimental Pydantic AI observation and synchronous monitoring with Watcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1", "pydantic-ai-slim==1.0.15", "opentelemetry-api==1.37.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_pydantic_ai"]

[tool.uv.sources]
watcher-sdk = { path = "../.." }

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
junit_family = "legacy"

[tool.uv]
exclude-newer = "7 days"
