[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watcher-roo-code-bridge"
version = "0.1.0"
description = "Experimental public Watcher SDK bridge for roo-code"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv.sources]
watcher-sdk = { path = "../../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_roo_code_bridge"]

[tool.uv]
exclude-newer = "7 days"
package = true

[tool.uv.workspace]
members = []
