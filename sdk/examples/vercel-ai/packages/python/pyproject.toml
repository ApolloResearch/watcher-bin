[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watcher-vercel-ai-bridge"
version = "0.1.0"
description = "Experimental public Watcher SDK bridge for vercel-ai"
requires-python = ">=3.12"
dependencies = ["watcher-sdk>=0.1,<1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv.sources]
watcher-sdk = { path = "../../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_vercel_ai_bridge"]

[tool.uv]
exclude-newer = "7 days"
package = true

[tool.uv.workspace]
members = []
