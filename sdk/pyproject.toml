[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watcher-sdk"
version = "0.36.0"
description = "Python SDK for the Watcher API (Watcher monitoring platform)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.3",
    "regex>=2024.11.6",
    "tenacity>=9.0.0",
    "anyio>=4.8.0",
    "attrs>=25.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "openapi-python-client>=0.28.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_sdk", "src/watcher_transcript_transport"]
