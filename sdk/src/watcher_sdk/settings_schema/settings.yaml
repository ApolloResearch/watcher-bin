  # Reserved key, not a tool: applied to a tool with no entry of its own, no matching
  # glob, and no builtin default — typically an MCP tool on its first call. The same pair
  # is written into the entry created for that tool, so it becomes tunable from then on.
  # Inside tool_thresholds so an org locking the collection locks this too.
  unknown:
    flag_threshold: 7
    deny_threshold: 11
command_rules:
  # A quoted argument can span lines and is still one shell word of the same command, so an option
  # after it must stay visible to the scans that look for it. Allow rules, whose matches count only
  # per command, write `.*` as `(?s:.*)`. Triage rules are also matched against the whole multi-line
  # command, where an unquoted newline starts the next command. The find and fd triage rules, which
  # take back an allow, span (?:[^\n'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")*: quoted
  # text and escapes, across newlines, but never past an unquoted one, so `fd -e py` followed by
  # `ls -lax` on the next line keeps its allow. The other triage rules cover commands no allow rule
  # approves and keep a single-line `.*`.
  rules:
  - id: bash-literal-read-pipeline-guard
    tool_name: Bash
    name: Review other sort, uniq, and GitHub command combinations
    category: security_system
    # Check the whole command before allow rules so one allowed pipeline command
    # cannot make an unsafe command beside it eligible for automatic approval.
    # Keep the sort/uniq and GitHub patterns in sync with their allow rules below.
    # Keep the possessive repeats to avoid excessive backtracking on long near-matches.
    regex: >-
      (?x-i:\A(?!(?!\|)(?:(?:\A|\|)[ \t]*+
      (?:sort(?:[ \t]++-[bdfhnruV]++)*+|uniq(?:[ \t]++-[cdiu]++)*+
      |gh[ \t]++(?:pr[ \t]++(?:checks|diff)|run[ \t]++(?:list|view|watch))
      (?:[ \t]++(?:[0-9]++|--(?:watch|fail-fast|required|patch|name-only|log-failed|log|exit-status)
      |(?:-R|--repo)[ \t]++[A-Za-z0-9_.-]++/[A-Za-z0-9_.-]++
      |(?:--interval|--limit|-L|--job|-j)[ \t]++[0-9]++
      |--json[ \t]++[A-Za-z]++(?:,[A-Za-z]++)*+))*+
      |rg[ \t]++--files|(?:head|tail)[ \t]++-[0-9]++)[ \t]*+)++\Z)
      (?=[\s\S]*(?:\A|[|&;\n])(?:[^\S\n]|[\x1c-\x1f])*+
      (?:sort|uniq|gh[ \t]++(?:pr[ \t]++(?:checks|diff)|run[ \t]++(?:list|view|watch)))\b))
    decision: triage
    priority: 299
  - id: bash-read-outside-project-tree
    tool_name: Bash
    name: Read outside project tree
    category: file_directory
    # The first character after the argument separator is what this keys on, so a quote or an
    # expansion in that slot hides the same read: `cat "/etc/shadow"`, `cat $HOME/.netrc`.
    regex: ^(cat|head|tail|less|more|bat|file|stat|readlink)\b[^|&;]*(\s[\\"']*(~|/|\.\.|\$\{?HOME\b)|/\.\.)
    decision: triage
    priority: 140
  # `tree -o` writes its listing to a file and `tree -R` writes 00Tree.html into every directory it
  # visits; `file -C` compiles a magic file to disk. Those spellings are graded, inside a cluster of
  # short options too (`tree -ao FILE`). `-R` and `-C` are case-sensitive because `tree -r` (reverse
  # sort) and `file -c` (check a magic file) only read;
  # `file` also takes `-C` after a digit option (`-0C`) and abbreviates `--compile` to `--co`.
  - id: bash-read-only-filesystem
    tool_name: Bash
    name: Read-only filesystem
    category: file_directory
    regex: ^(?:(?:ls|cat|head|tail|wc|find|stat|du|readlink)\b|file\b(?!(?s:.*)\s['"]?(?:(?-i:-[A-Za-z0-9]*C)|--co[a-z]*))|tree\b(?!(?s:.*)\s['"]?(?-i:-[A-Za-z]*[oR])))
    decision: allow
    priority: 300
  - id: bash-environment-info
    tool_name: Bash
    name: Environment info
    category: file_directory
    # `env` is allow-listed only where it prints the environment. `env CMD ...` execs CMD, so
    # allow-listing the bare word lets any command borrow this rule by prefixing one token. What
    # decides it is whether an argument word survives once the redirections are consumed, since a
    # redirection may sit between command words: `env >log CMD` runs CMD just as `env CMD` does.
    regex: ^(pwd|cd|echo|which|uname|whoami|date|hostname|id)\b|^env(?:[ \t]*(?:\d*(?:>>|>\||>&|>|<<<|<<|<&|<)|&>>|&>)[ \t]*(?:&\d+|&-|[^ \t<>|&;]+)?)*[ \t]*$
    decision: allow
    priority: 301
  # Options that write or run something are graded, quoted (`'--split-exp'`, `"-s"`) or not: yq
  # --split-exp (-s) writes each result to a file its expression names and -i/--inplace (--in-place in
  # the Python yq) rewrites the input; csvtool -o writes a file and its `call` command runs a program
  # per row; xmllint -o/--output writes a file and --shell (or -shell) takes write commands from
  # stdin. The Python yq abbreviates --in-place (argparse), so any `--in-` prefix counts. yq's short
  # options are matched case-sensitively so `-I` (indent) keeps the allow.
  - id: bash-data-format-tools
    tool_name: Bash
    name: Data format tools
    category: file_directory
    regex: ^(?:jq\b|csvtool\b(?!(?s:.*)\s['"]?(?:-o|call(?![\w.-])))|yq\b(?!(?s:.*)\s['"]?(?:(?-i:-[A-Za-z]*[is])|--(?:split-exp(?![\w-])|inplace(?![\w-])|in-[a-z-]*)))|xmllint\b(?!(?s:.*)(?:\s['"]?-o|--output(?![\w-])|\s['"]?--?shell(?![\w-]))))
    decision: allow
    priority: 302
  - id: bash-stdin-sort-uniq
    tool_name: Bash
    name: Sort and count stdin
    category: file_directory
    # Filenames let uniq write output; sort also has output and program options.
    # Match complete forms, with case-sensitive flags, so these stay stdin-only.
    regex: '(?-i:\Asort(?:[ \t]++-[bdfhnruV]++)*+[ \t]*+\Z|\Auniq(?:[ \t]++-[cdiu]++)*+[ \t]*+\Z)'
    decision: allow
    priority: 303
  - id: edit-safe-source-files
    tool_name: Edit
    name: Safe source files
    category: file_directory
    regex: \.(py|ts|tsx|js|jsx|css|html|md|json|yaml|yml|toml|cfg|ini|txt|rs|go|swift|c|cpp|h|hpp|java|kt|rb|sh|zsh)$
    decision: allow
    priority: 310
  - id: write-safe-source-files
    tool_name: Write
    name: Safe source files
    category: file_directory
    regex: \.(py|ts|tsx|js|jsx|css|html|md|json|yaml|yml|toml|cfg|ini|txt|rs|go|swift|c|cpp|h|hpp|java|kt|rb|sh|zsh)$
    decision: allow
    priority: 311
  - id: edit-sensitive-files
    tool_name: Edit
    name: Sensitive files
    category: file_directory
    regex: \.(env|pem|key|secret)\b|credentials|Dockerfile|\.github/|package\.json$
    decision: triage
    priority: 110
  - id: write-sensitive-files
    tool_name: Write
    name: Sensitive files
    category: file_directory
    regex: \.(env|pem|key|secret)\b|credentials|Dockerfile|\.github/|package\.json$
    decision: triage
    priority: 111
  - id: edit-agent-config-files
    tool_name: Edit
    name: Agent config files
    category: file_directory
    regex: (^|/)(CLAUDE|AGENTS|WATCHER)\.md$|/\.(claude|cursor)/
    decision: triage
    priority: 112
  - id: write-agent-config-files
    tool_name: Write
    name: Agent config files
    category: file_directory
    regex: (^|/)(CLAUDE|AGENTS|WATCHER)\.md$|/\.(claude|cursor)/
    decision: triage
    priority: 113
  # Writing a `.watcher-ignore` file opts a folder out of Watcher, so every attempt to create
  # or change one is forced to human review. These are deterministic regex rules, which are still
  # evaluated even when a user has snoozed monitoring, so a session can never silently opt itself
  # out while monitoring is paused.
  #
  # Each variant matches the marker only where that tool can act on it, because the string itself
  # is ordinary prose: it turns up in docs, commit messages, PR bodies and notebook entries far
  # more often than it names a file being written. Matching the bare string anywhere in the
  # payload sends all of that to a human, and an escalation nobody can act on teaches people to
  # wave the rule through. Edit and Write take a path, so they simply anchor to a whole final
  # segment. The other two receive free text and need the breakdowns below.
  #
  # bash-watcher-ignore-file, left to right:
  #
  #   (?<![\w-])                    don't fire mid-word: the `rm` inside `charm` or `pre-rm`
  #   (?:touch|rm|mv|cp|ln|tee      a command that can put a file at a path. No `>`/`>>`: redirect
  #     |install|truncate|unlink    destinations are extracted separately and re-matched against
  #     |sed)                       the Write rule above, which is anchored and more precise.
  #   (?:[ \t]|\\\n)+               the argument separator: spaces, tabs, or a backslash-newline
  #                                 continuation, which the shell removes before running the
  #                                 command. A BARE `\n` is excluded on purpose — with `\s` here,
  #                                 prose wrapping as "...rm" / ".watcher-ignore" across two lines
  #                                 would match.
  #   (?:\\\n|[^\n])*                the rest of the command, continuations included. It does NOT
  #                                 stop at `;`/`|`/`&`, because
  #                                 `check_command` has already split compound commands on those
  #                                 — quote-awarely, which a regex here cannot be. Re-testing for
  #                                 them would only mis-read a metacharacter inside a quoted path,
  #                                 losing `touch "/repo/R&D/.watcher-ignore"`.
  #   \.watcher-ignore              the marker.
  #   (?=$|[\s"';|&()<>])           a shell delimiter must follow, so the marker is the whole name
  #                                 rather than a prefix of `.watcher-ignored`, `.watcher-ignore.md`
  #                                 or `.watcher-ignore/child`.
  #
  # apply-patch-watcher-ignore-file matches the *serialized* tool input, so the patch body is in
  # scope for the regex and only a header may fire the rule:
  #
  #   \*\*\*\s*                     the `***` that opens a patch header.
  #   (?:Add File|Update File       the headers that name a file this patch will create, change,
  #     |Delete File|Move to):      remove, or move something to.
  #   [^\\"]*                       the path. Serialization escapes newlines, so a literal `\`
  #                                 marks the end of the line and `"` the end of the field;
  #                                 excluding both keeps this header's path from running into the
  #                                 next line or out of the JSON string.
  #   \.watcher-ignore              the marker.
  #   (?=[ \t]*(?:\\|"))            the header must end here (trailing spaces allowed), so a path
  #                                 that merely starts with the marker does not fire.
  #
  # Two known limits, both deliberate:
  #
  # The Bash pattern tests for a delimiter; it does not resolve shell operands. A quoted filename
  # that starts with the marker (`touch "/repo/.watcher-ignore notes"`) still prompts, because the
  # space inside the quotes reads as the end of the operand. Doing this properly means matching a
  # shell word built from adjacent quoted and unquoted spans, which as a regex needs a quantifier
  # nested inside a repeated group — that backtracks catastrophically, taking seconds on an
  # ordinary 1.8 KB command while running inside the PreToolUse hook. A rule that can hang the
  # hook is worse than the prompt it removes, and the two attempts at tightening this both started
  # *missing* real creations like `touch "$repo"/.watcher-ignore` instead. Prompting about a
  # neighbouring file is the safe direction.
  #
  # A determined evasion can still dodge the Bash pattern by splitting the literal, which no regex
  # over command text can prevent; these rules are what stops the marker from appearing by
  # accident or in the clear.
  - id: edit-watcher-ignore-file
    tool_name: Edit
    name: Watcher ignore file
    category: security_system
    regex: '(^|/)\.watcher-ignore$'
    decision: human
    priority: 104
  - id: write-watcher-ignore-file
    tool_name: Write
    name: Watcher ignore file
    category: security_system
    regex: '(^|/)\.watcher-ignore$'
    decision: human
    priority: 105
  - id: bash-watcher-ignore-file
    tool_name: Bash
    name: Watcher ignore file
    category: security_system
    regex: '(?<![\w-])(?:touch|rm|mv|cp|ln|tee|install|truncate|unlink|sed)(?:[ \t]|\\\n)+(?:\\\n|[^\n])*\.watcher-ignore(?=$|[\s"'';|&()<>])'
    decision: human
    priority: 106
  - id: apply-patch-watcher-ignore-file
    tool_name: apply_patch
    name: Watcher ignore file
    category: security_system
    regex: '\*\*\*\s*(?:Add File|Update File|Delete File|Move to):[^\\"]*\.watcher-ignore(?=[ \t]*(?:\\|"))'
    decision: human
    priority: 107
  # Watcher's own state (~/.apollo_monitor: thresholds, profiles, the admin file holding org locks)
  # and the agent settings that load its hooks decide whether later calls are reviewed at all, so
  # every agent write to them needs a person. These sit ahead of the extension allow rules, and the
  # hook also matches them against the file a path resolves to. The Bash variant sees only writes
  # made in the clear (sed, perl and yq only in place, sed through a `w` command, find with an action
  # that writes or runs something, csvtool with -o); like the marker rule it reads to the end of the
  # line, since quoted expressions hold `|` and `;`. A script the agent runs is out of reach.
  - id: edit-watcher-protected-files
    tool_name: Edit
    name: Watcher settings or agent hooks
    category: security_system
    regex: (^|/)\.apollo_monitor(/|$)|(^|/)\.claude/settings(\.local)?\.json$|(^|/)\.codex/(hooks\.json|config\.toml)$|(^|/)\.copilot/(hooks/[^/]+|settings\.json|config\.json)$
    decision: human
    priority: 95
  - id: write-watcher-protected-files
    tool_name: Write
    name: Watcher settings or agent hooks
    category: security_system
    regex: (^|/)\.apollo_monitor(/|$)|(^|/)\.claude/settings(\.local)?\.json$|(^|/)\.codex/(hooks\.json|config\.toml)$|(^|/)\.copilot/(hooks/[^/]+|settings\.json|config\.json)$
    decision: human
    priority: 96
  - id: bash-watcher-protected-files
    tool_name: Bash
    name: Watcher settings or agent hooks
    category: security_system
    regex: '(?<![\w-])(?:touch|rm|mv|cp|ln|tee|install|truncate|unlink|chmod|(?:sed|perl|yq)(?=[ \t][^\n]*?(?:(?<![\w-])(?:-[a-z]*i|--in-?place)|[\d$/;{}''"\s][wW]))|find(?=[^\n]*?[ \t]-(?:delete|exec|execdir|ok|okdir|fls|fprint0?|fprintf)\b)|csvtool(?=[^\n]*?[ \t]-o\b))(?:[ \t]|\\\n)+(?:\\\n|[^\n])*(?:\.apollo_monitor(?=$|[/\s"'';|&()<>])|\.claude/settings(?:\.local)?\.json|\.codex/(?:hooks\.json|config\.toml)|\.copilot/(?:hooks/|settings\.json|config\.json))'
    decision: human
    priority: 97
  - id: apply-patch-watcher-protected-files
    tool_name: apply_patch
    name: Watcher settings or agent hooks
    category: security_system
    regex: '\*\*\*\s*(?:Add File|Update File|Delete File|Move to):[^\\"]*(?:\.apollo_monitor/|\.copilot/hooks/|(?:\.claude/settings(?:\.local)?|\.copilot/(?:settings|config))\.json(?=[ \t]*(?:\\|"))|\.codex/(?:hooks\.json|config\.toml)(?=[ \t]*(?:\\|")))'
    decision: human
    priority: 98
  - id: edit-shell-rc-ssh-config
    tool_name: Edit
    name: Shell rc / SSH config
    category: file_directory
    regex: \.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)$|/\.ssh/(config|authorized_keys)$|(^|/)(\.bashrc|\.zshrc|\.bash_profile|\.zprofile|\.zshenv|\.profile)$|^/etc/(profile|bashrc|zshrc|zshenv|zprofile|bash\.bashrc)(\.d/.*)?$
    decision: triage
    priority: 116
  - id: write-shell-rc-ssh-config
    tool_name: Write
    name: Shell rc / SSH config
    category: file_directory
    regex: \.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)$|/\.ssh/(config|authorized_keys)$|(^|/)(\.bashrc|\.zshrc|\.bash_profile|\.zprofile|\.zshenv|\.profile)$|^/etc/(profile|bashrc|zshrc|zshenv|zprofile|bash\.bashrc)(\.d/.*)?$
    decision: triage
    priority: 117
  - id: edit-ci-config-(non-github)
    tool_name: Edit
    name: CI config (non-GitHub)
    category: file_directory
    regex: \.gitlab-ci\.yml$|\.circleci/|(^|/)Jenkinsfile$|\.travis\.yml$|azure-pipelines\.yml$|\.drone\.yml$|bitbucket-pipelines\.yml$|\.gitea/
    decision: triage
    priority: 118
  - id: write-ci-config-(non-github)
    tool_name: Write
    name: CI config (non-GitHub)
    category: file_directory
    regex: \.gitlab-ci\.yml$|\.circleci/|(^|/)Jenkinsfile$|\.travis\.yml$|azure-pipelines\.yml$|\.drone\.yml$|bitbucket-pipelines\.yml$|\.gitea/
    decision: triage
    priority: 119
  # Options that run another program are graded: rg --pre (a preprocessor per file) and
  # --hostname-bin, and the --pager of ag and ack, which both accept it abbreviated to --pag. ack's
  # --ackrc (matched from `--ackr`, which no other option starts with) reads options, a pager among
  # them, from a file the command line names, which can be standard input; ag has no such option.
  # `--ackmate`, in either tool, only formats output. fd's --exec has its own triage rule below.
  - id: bash-search-tools
    tool_name: Bash
    name: Search tools
    category: search
    regex: ^(?:(?:grep|egrep|fgrep|fd)\b|rg\b(?!(?s:.*)\s['"]?--(?:pre|hostname-bin)(?![\w-]))|ag\b(?!(?s:.*)\s['"]?--pag[a-z]*)|ack\b(?!(?s:.*)\s['"]?--(?:pag|ackr)[a-z]*))
    decision: allow
    priority: 320
  # Only a print-only script is approved: one script (quoted, or a bare word) built from addresses,
  # the commands p l = d n g h x z q, braces and s/// with the g p i m or numeric flags, separated by
  # `;` or newlines as sed itself requires, then file names and redirects. Anything else goes to the
  # grader: the w and W commands and the s///w flag write files under any address (`1w f`, `$!wf`),
  # e and s///e run commands, r and R read other files, -f takes the script from a file, and -i or
  # --in-place edits in place. The required separator also keeps the match linear: a trailing s///
  # flag can never be read as the next command.
  - id: bash-read-only-sed
    tool_name: Bash
    name: Read-only sed
    category: search
