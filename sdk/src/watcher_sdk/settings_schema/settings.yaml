    # `-f`/`-C` repoint make at a makefile or directory of the caller's choosing, and `-I` /
    # `--include-dir` makes an `include` or `-include` in the repository's Makefile read a file from
    # such a directory, so those lose the allow, as do `-E`/`--eval` (a recipe written on the
    # command line), a `!=` assignment (which runs its right-hand side in the shell), assigning
    # SHELL, .SHELLFLAGS, MAKEFILES or MAKEFLAGS (which pick the program every recipe line runs
    # under, add a makefile, or pass options), and
    # any `$` in the arguments: make exports command-line variables to every recipe and expands
    # them, so `FOO=$(shell CMD)` runs CMD even if the Makefile never mentions FOO, and the shell
    # can hand make that `$(` from an escaped or quoted spelling (`FOO=\$\(shell\ CMD\)`). Short
    # options also count inside a cluster of make's no-argument flags (`-sf`, `-Lf`) or with an
    # attached value (`-fMakefile.dev`, `-Csubdir`, `-Idir`), and make accepts any unambiguous
    # prefix of a long option (`--fil`, `--mak`, `--di`, `--ev`, `--in`). These options are found
    # by walking whole shell words (quotes and backslash escapes keep a word together), so a
    # compiler flag inside a variable's value (`CFLAGS="-E -O2"`, `CFLAGS="-fPIC"`) is not read as
    # one.
    # Plain variable values still reach whichever recipes the Makefile writes them into; what those
    # recipes run is the repository's to define, as above.
