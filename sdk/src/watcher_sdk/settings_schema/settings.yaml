  # The test, lint and build allow rules below approve by name, but the repository defines what runs
  # (Makefile, conftest.py, package.json scripts, build.rs, the project build behind `uv run`), so an
  # approved run can change anything, Watcher's settings included. Accepted risk: no grader sees
  # those files either, and isolation or MDM protection of Watcher's files is what limits it. An
  # organization that wants them graded sets each to `triage` with `permission: locked` in its managed
  # settings (customer docs: concepts/organization-settings.md, "Grading test, lint and build commands").
  # Options that write or delete at a path the command line names, or upload, lose the allow even so:
  # those need no repository file. That covers pytest's --junitxml, --basetemp (emptied before the
  # run), --log-file, --debug, -o/--override-ini (which can set those paths) and --pastebin (uploads
  # results); the report paths of pytest-cov (`--cov-report=xml:PATH`), pytest-html and
  # pytest-reportlog; go's -o and profile outputs; swift's --xunit-output; libtest's --logfile;
  # mypy's report options (`--linecount-report DIR` writes DIR/linecount.txt; every `--*-report`),
  # --junit-xml, the hidden --timing-stats / --line-checking-stats files and --cache-map (cache
  # files at the paths it names); flake8's --output-file; ty's --update-baseline; and tsc's trace,
  # profile and build-info files, or any emit once `--noEmit false` turns it back on.
  # mypy and flake8 accept any unambiguous prefix of a long option, so each mypy option is matched
  # from its shortest unambiguous prefix among mypy's options (`--ti`, `--ht`, `--con`) or a shorter
  # stem it shares with other matched options: mypy rejects `--line` and `--xs` as ambiguous, but
  # every option they begin (`--linecount-report`, `--line-checking-stats`, `--xslt-txt-report`) is
  # one to grade. flake8 reads --config, --append-config and --output-file in a first pass that
  # knows only a few options, where `--c` and `--co` already mean --config, so every prefix of
  # those three is matched while --count and --color keep the allow.
  # Build-output directories (swift's --scratch-path / --build-path, Cargo's --target-dir) stay
  # allowed: they pick where the tool keeps its own build tree, not a file to overwrite.
  # Go's -gcflags, -asmflags and -gccgoflags hand options to the compiler and assembler, several of
  # which write files at a named path or read an import config, so they lose the allow. Each
  # -ldflags must be followed by a value made only of -s, -w, -X NAME=VALUE and -buildid=ID
  # (optionally after a `pattern=` prefix, flags case-sensitive as Go reads them, no escapes; Go
  # splits the value itself, so inside a quoted value an -X operand may sit in the other kind of
  # quote, `-ldflags="-X 'main.v=1.2.3'"`); any other -ldflags value is graded.
  # Options that name a program to run lose it for the same reason: go's -exec, -toolexec and
  # -extld, Cargo's --config (a test runner or rustc wrapper), mypy's --python-executable and
  # pyright's --pythonpath (each runs the named interpreter to find installed packages), mypy's
  # --install-types (runs pip to install stub packages), flake8's --config and --append-config
  # (a `[flake8:local-plugins]` section imports a module from a named directory), swift's
  # --toolset, --destination, SDK and toolchain options and its -X… pass-through options
  # (-Xswiftc, -Xcc, -Xlinker, which hand flags to the compiler or linker), npm's --node-options and
  # --script-shell (npm expands `--scr`), and npm's --userconfig and --globalconfig, whose file can
  # set the script shell; `npm run build` and `swift build` (under Build commands) lose the allow
  # for these too.
  # pytest's -c / --config-file names an ini file whose addopts can carry any of the pytest options
  # above, like make's -f; mypy's --config-file (down to `--con`) is graded the same way, since its
  # file can set python_executable and the report directories. Options that point a runner at another
  # project are graded for the same reason: go's -C, -overlay (source files replaced by others) and
  # -modfile, Cargo's --manifest-path, swift's --package-path and npm's --prefix / -C. npm strips any
  # number of leading dashes (`-prefix=DIR`, `---prefix=DIR`, `--C DIR`) and expands a cluster of
  # short aliases (`-sC DIR`, `--sC DIR`), so those spellings are matched too. The -C check walks the
  # words after the script name (`test:unit` and `build:prod` included; quotes and backslash escapes
  # keep a word together) and stops at a standalone `--`, after which npm passes words to the script
  # untouched (`npm test -- --collectCoverage`); a `--` inside a quoted or escaped value does not
  # stop it. Test paths given to pytest are not graded: agents routinely pass absolute paths into
  # their own repository. pytest, mypy, ruff, ty and tsc also read arguments from a file named with
  # a leading `@` (`pytest @args.txt`), which can hold any option above, and so does rustdoc for the
  # words after `cargo test --` when it runs doctests (`--logfile` inside the file), so an `@` word
  # loses the allow for them and for cargo.
  - id: bash-python-tests
    tool_name: Bash
    name: Python tests
    category: testing_build
    regex: ^(uv\s+run\s+pytest|python\s+-m\s+pytest|pytest)\b(?!(?s:.*)(?:--(?:junit-?xml|basetemp|log-file|debug|override-ini|pastebin|html|report-log|json-report-file)(?![\w-])|--cov-report['"]?(?:=|\s+)['"]?(?!term)[a-z]+:|--config-file(?![\w-])|\s['"]?-o|\s['"]?(?-i:-c)|\s['"]?@))
    decision: allow
    priority: 340
