  - id: bash-find-with-side-effects
    tool_name: Bash
    name: find with side effects
    category: file_directory
    regex: ^find\b(?=(?:[^\n'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")*[\s"'\\]-(delete|exec|execdir|fls|fprint0?|fprintf|ok|okdir)\b)
    decision: triage
    priority: 240
  # -x and -X are found inside a short-option cluster (`-Hx`) and with an attached command (`-xrm`).
  # A cluster ends at the first short option that takes a value (d t e E c j S o C), whose value is
  # the rest of the word, so `-ejsx` (extension jsx) is not read as -x. Any other letter counts as a
  # flag, so a no-value flag fd adds later still cannot hide an -x behind it.
  - id: bash-fd-with---exec
    tool_name: Bash
    name: fd with --exec
    category: search
    regex: ^fd\b(?:[^\n'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")*[\s"'\\]-(?:(?-i:(?:(?![dteEcjSoC])[A-Za-z0-9])*[xX])|-exec(?:-batch)?(?![\w-]))
    decision: triage
    priority: 241
