    regex: ^(?:(?:npm\s+test|npm\s+run\s+(?:test|lint|check))\b(?!(?:[^\s'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")*(?:\s+(?!--(?:\s|$))(?:[^\s'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")+)*?\s+['"]?(?-i:-+[a-zA-Z]*C))|npx\s+(?:jest|vitest|prettier)|npx\s+eslint(?!(?s:.*)\s-o))\b(?!(?s:.*)(?:--output-?file(?![\w-])|[\s'"]-+(?:node-o|scr|userc|globalc|prefi)[a-z-]*))
