  # `git branch` lists branches, but its options also delete, force-move, rename, copy and re-track
  # them, and --edit-description opens an editor; any of those (short options in any cluster, as in
  # `-rd`) is graded. Git accepts any unambiguous prefix of a long option (`--dele`, `--forc`), so
  # the long forms are matched by their shortest unambiguous prefix among `git branch` options.
  # Creating a branch by naming one stays allowed: it changes no existing ref. A word straight after
  # `--sort` is its key, so `--sort -committerdate` keeps the allow; git reads that word as the key
  # even when it looks like an option, so `--sort -D x` deletes nothing.
  # `git fetch --upload-pack` (from `--upl`) runs the named command for a local or ssh remote, so it
  # is graded, and so is `--set-upstream` (from `--set`), which rewrites the current branch's
  # upstream like `git branch -u`. A refspec with a colon (`+feature:main`,
  # `refs/heads/*:refs/heads/*`) writes local refs and, with --prune, deletes them, so a colon
  # anywhere after the remote is graded, as are --refmap, --stdin (refspecs the command line does not
  # show) and --prune-tags / -P (deletes local tags). The remote, which may itself be
  # `git@host:repo`, is the first word that is not an option or the value of one (`--depth 1`,
  # `--shallow-since '1 month ago'`, with a quoted value read as one word either way,
  # `--shallow-since="1 month ago"`), a lone `-`, or the word after `--` or `--end-of-options`. Only
  # the exact names of the options `git fetch -h` lists as taking a separate value are skipped with
  # their value, inside an atomic group: a no-value option counted as taking one would hide the real
  # remote and let a refspec pass as the remote. `--output` needs no prefix form: every prefix of it
  # is also a prefix of --output-indicator-*, which git rejects as ambiguous.
  - id: bash-git-read-only
    tool_name: Bash
    name: Git read-only
    category: git
    regex: ^git\s+(status|diff|log|show|branch\b(?!(?:(?s:.*)\s(?!--so[a-z]*\s)\S+)?\s+['"]?-(?:[a-z]*[cdfmtu]|-(?:d|forc|mo|cop|cr|se|u|e|t)[a-z-]*))|fetch\b(?!(?s:.*)\s['"]?(?:--(?:upl|refm|st|prune-|set)[a-z-]*|(?-i:-[a-zA-Z0-9]*P)))(?!\s+(?>(?:(?:--(?:jobs|depth|shallow-since|shallow-exclude|deepen|server-option|negotiation-tip|filter|submodule-prefix|recurse-submodules-default)|(?-i:-[jo]))\s+(?:[^\s'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")+\s+|--(?!end-of-options\s)(?:[^\s'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")+\s+|-[^\s-](?:[^\s'"\\]|\\(?s:.)|'[^']*'|"(?:[^"\\]|\\(?s:.))*")*\s+)*)(?:--(?:end-of-options)?\s+\S+|-(?=\s)|[^\s-]\S*)\s(?s:.*):)|ls-tree|ls-files|blame|shortlog|describe|tag\s+-l)\b(?!(?s:.*)--output(?![\w-]))
    decision: allow
    priority: 330
