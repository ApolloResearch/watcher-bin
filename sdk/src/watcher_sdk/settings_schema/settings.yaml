    regex: ^(cargo\s+(test|check|clippy)\b(?!(?s:.*)(?:--(?:config|logfile|manifest-path)(?![\w-])|\s['"]?@))|go\s+test\b(?!(?s:.*)\s['"]?--?(?:test\.)?(?:o|(?:cover|cpu|mem|block|mutex)profile|trace|outputdir|exec|toolexec|overlay|modfile)(?![\w-]))(?!(?s:.*)-extld)(?!(?s:.*)\s['"]?--?(?:gc|asm|gccgo)flags(?![\w-]))(?!(?s:.*)[\s'"]-?-ldflags(?!['"]?(?:=|\s+)(?:'(?:[^\s'"=\\-][^\s'"=\\]*=)?(?-i:-[sw]|-X(?:=|\s+)[^\s'"\\-][^\s'"\\]*|-X\s+"[^\s'"\\-][^'"\\]*"|-buildid=[^\s'"\\]*)(?:\s+(?-i:-[sw]|-X(?:=|\s+)[^\s'"\\-][^\s'"\\]*|-X\s+"[^\s'"\\-][^'"\\]*"|-buildid=[^\s'"\\]*))*'|\"(?:[^\s'"=\\-][^\s'"=\\]*=)?(?-i:-[sw]|-X(?:=|\s+)[^\s'"\\-][^\s'"\\]*|-X\s+'[^\s'"\\-][^'"\\]*'|-buildid=[^\s'"\\]*)(?:\s+(?-i:-[sw]|-X(?:=|\s+)[^\s'"\\-][^\s'"\\]*|-X\s+'[^\s'"\\-][^'"\\]*'|-buildid=[^\s'"\\]*))*"|(?:[^\s'"=\\-][^\s'"=\\]*=)?(?-i:-[sw]|-X(?:=|\s+)[^\s'"\\-][^\s'"\\]*|-buildid=[^\s'"\\]*))(?=\s|$)))(?!(?s:.*)\s['"]?(?-i:--?C)(?![\w-]))|swift\s+test\b(?!(?s:.*)(?:--(?:xunit-output|package-path)(?![\w-])|--(?:toolset|destination|(?:experimental-)?swift-sdks?(?:-path)?|sdk|toolchain)(?![\w-])|\s['"]?(?-i:-+X[a-z]))))\b
