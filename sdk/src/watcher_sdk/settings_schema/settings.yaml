version: 1
name: Default
description: Standard Watcher permissions with human review for higher-risk tool calls.
aliases:
- normal
- standard
profiles:
  permission: additions_allowed
  default: {}
  auto:
    name: Auto
    description: Allow low-risk tool calls automatically and auto-deny high-risk calls.
    aliases:
    - automatic
    policy_monitors:
      triage_max_allow_score: 6
      on_grading_failure: allow
    tool_thresholds:
      "*":
        flag_threshold: 11
        deny_threshold: 8
      AskUserQuestion:
        flag_threshold: 11
        deny_threshold: 11
      EnterPlanMode:
        flag_threshold: 11
        deny_threshold: 11
      ExitPlanMode:
        flag_threshold: 11
        deny_threshold: 11
    command_rules:
      rules: []
  permissive:
    name: Human in the Loop
    description: Standard Watcher permissions but with a higher bar before escalating tool calls to human review.
    aliases:
    - human-in-the-loop
    - lenient
    tool_thresholds:
      Bash:
        flag_threshold: 8
        deny_threshold: 11
      Edit:
        flag_threshold: 8
        deny_threshold: 11
      Write:
        flag_threshold: 8
        deny_threshold: 11
      NotebookEdit:
        flag_threshold: 8
        deny_threshold: 11
      PowerShell:
        flag_threshold: 8
        deny_threshold: 11
      Monitor:
        flag_threshold: 8
        deny_threshold: 11
      Skill:
        flag_threshold: 8
        deny_threshold: 11
      WebFetch:
        flag_threshold: 8
        deny_threshold: 11
      apply_patch:
        flag_threshold: 8
        deny_threshold: 11
  skip-permissions:
    name: Skip Permissions
    description: Allow tool calls without rule checks or grading. (Turns Watcher's blocking checks off; sessions are still ingested and reviewed server-side.)
    aliases:
    - "off"
    - disabled
    policy_monitors:
      on_grading_failure: allow
    tool_thresholds:
      "*":
        flag_threshold: 11
        deny_threshold: 11
  # Register profiles only when their settings are included in the package. A missing
  # profile body would apply an empty overlay and leave the base settings active.
ui:
  autostart_on_login: false
policy_monitors:
  policy_gateway_grader_id: c0000001-0000-0000-0000-000000000001
  policy_triage_grader_id: c0000001-0000-0000-0000-000000000002
  triage_max_allow_score: 6
